project_primer:
  project_identity:
    name: "Roto"
    mission_summary: >
      Offline, privacy-first Android app (F-Droid friendly) that tells parents,
      carers, and organisers what is scheduled on any given date using rotating week
      patterns (Week 1 / Week 2 / Week 3 …).
    core_question: "What's on the rota tomorrow?"
    status: "Interactive Compose app in place with JSON import, tomorrow/today view, week browser, and override-aware domain logic."
    audience:
      primary:
        - parents
        - carers
        - school-age children
      stretch:
        - anyone managing repeating school/club/meal rotas
    principles:
      - offline_first: "All rota data and logic stay on device; no servers or logins."
      - privacy: "No analytics, tracking, or ads; F-Droid-friendly dependencies only."
      - human_editable_data: "Parents/carers can paste and edit a human-readable JSON rota."
      - predictable: "If there is no rota for a date, surface a clear 'No rota found' message."

  product_scope:
    core_features:
      - key: show_tomorrow_default
        description: "Launch straight into tomorrow's rota with ordered slots, notes, and any override reason."
      - key: choose_any_date
        description: "Allow quick selection of any date to view the corresponding rota entry."
      - key: rotation_awareness
        description: "Map real calendar dates to Week 1/2/3 style cycles via configured week_commencing Mondays, honour per-date overrides, and loop indefinitely when a repeat anchor is provided."
      - key: offline_persistence
        description: "Persist the rota JSON locally so data survives app restarts and works offline."
      - key: human_editable_data
        description: "Support pasting or importing JSON that parents can tweak or regenerate with an AI."
      - key: browse_week_rota
        description: "Allow families to open any published week pattern and inspect all configured days (weekday or weekend)."
    stretch_goals:
      - key: home_screen_widget
        description: "Android widget showing tomorrow's rota summary."
      - key: multiple_profiles
        description: "Optional ability to store rotas for more than one school or club."
      - key: holiday_exceptions
        description: "Parents can mark closed days or special events without editing the base rotation."
      - key: allergen_filtering
        description: "Surface dietary tags supplied by the school as display-only info."
      - key: export_import_share
        description: "One-tap share of the stored JSON to help other families."

  data_model:
    schema_version: "0.3"
    structure_highlights:
      - "school_name string (display header) and optional notes[] for global messages."
      - "cycle.weeks[] with week_id, week_commencing[] (ISO Mondays), and days{} mapping weekday names or ISO dates to DayDefinition."
      - "DayDefinition provides slots[] (ordered {label, text, tags[]}) plus optional notes[]."
      - "Optional cycle.repeat{start_date, start_week_id} enables the rota to loop indefinitely without enumerating future Mondays."
      - "overrides{} maps ISO dates to OverrideDay with closed/reason/slots/notes for one-off changes."
    design_rationale: "Supports any repeating rota (meals, clubs, duties) while staying human-editable for families and organisers."

  rotation_logic:
    steps:
      - "Check overrides{} for the target date; if found and closed=true, surface a polite closed message."
      - "If no override (or override supplies slots), find monday_of_week for the target date."
      - "Match monday_of_week against any cycle.weeks[].week_commencing entry."
      - "If nothing explicit matches and cycle.repeat is set, compute the week by looping from repeat.start_date onward."
      - "Resolve the day's slots by weekday key (monday…sunday) or ISO-specific key."
      - "If nothing matches, show a friendly 'No rota found for this date' message."

  tech_foundation:
    platform: "Android (minSdk 24, Kotlin, Jetpack Compose)."
    storage: "Keep JSON in user-managed files; remember the chosen URI via Preferences DataStore so the app can reload it."
    dependency_constraints:
      - "Avoid Google Play Services and proprietary analytics for F-Droid compliance."
      - "Keep the build reproducible with FLOSS-friendly tooling."

  architecture_and_ui:
    layers:
      - name: data_layer
        responsibilities:
          - load_rota_json_from_selected_source
          - remember_selected_rota_reference
          - parse_json_to_models (schema 0.3)
      - name: domain_layer
        responsibilities:
          - get_rota_for_date (override + rotation lookup)
          - format_slots_and_notes_for_presentation
      - name: ui_layer
        responsibilities:
          - Compose screens for home, pick-a-day, and setup
          - Manage minimal state via ViewModels
      - name: widget_layer (stretch)
        responsibilities:
          - Provide a glanceable tomorrow summary using the same domain logic
    screens:
      - home_screen:
          purpose: "Default landing page for tomorrow's rota."
          key_elements:
            - heading
            - formatted_date
            - slot_list (ordered slots with tags)
            - reason_or_notes (override/day/global notes)
            - button_view_other_day
      - pick_a_day_screen:
          purpose: "Browse any date's rota via date picker or next/prev controls."
      - setup_screen:
          purpose: "Initial and repeat JSON import/edit experience with validation."
    orientation:
      lock_to_portrait: "Keep the app in a non-rotating, vertical layout so the UI stays consistent for parents."

  development_environment:
    topology:
      dev_os: "WSL Fedora 42 inside Windows 11."
      editor: "VS Code connected to the WSL workspace."
      build_side: "WSL builds the APK via Gradle using Linux SDK and JDK."
      test_side: "Windows 11 runs the Android Emulator for interactive testing."
      privacy_target: "No Play Services dependency; deliver an F-Droid friendly offline app."
    wsl_fedora_setup:
      sdk_root: "/home/Mile/Android/sdk"
      java:
        version: "OpenJDK 21 (java-21-openjdk-devel or equivalent)."
        verification:
          - "java -version"
          - "javac -version"
        bashrc_exports:
          - 'export JAVA_HOME="/usr/lib/jvm/<java-21-path>"'
          - 'export PATH="$JAVA_HOME/bin:$PATH"'
      android_sdk:
        layout: "/home/Mile/Android/sdk with cmdline-tools, platform-tools, build-tools."
        bashrc_exports:
          - 'export ANDROID_SDK_ROOT="/home/Mile/Android/sdk"'
          - 'export ANDROID_HOME="$ANDROID_SDK_ROOT"'
          - 'export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"'
          - 'export PATH="$PATH:$ANDROID_SDK_ROOT/platform-tools"'
          - 'export PATH="$PATH:$ANDROID_SDK_ROOT/emulator"'
        essential_packages:
          - 'sdkmanager --licenses'
          - 'sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"'
    windows_11_setup:
      virtualization_check: "Task Manager → Performance → CPU → Virtualization: Enabled."
      android_sdk_root: "C:\\Android\\sdk"
      env_paths:
        - "C:\\Program Files\\Microsoft\\jdk-21.0.8.9-hotspot\\bin"
        - "C:\\Android\\sdk\\cmdline-tools\\latest\\bin"
        - "C:\\Android\\sdk\\platform-tools"
        - "C:\\Android\\sdk\\emulator"
      verification:
        - 'echo $env:JAVA_HOME'
        - 'java -version'
        - 'where.exe java'
        - 'sdkmanager --version'
      packages_to_install:
        - 'sdkmanager --licenses'
        - 'sdkmanager "platform-tools" "emulator" "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64"'
    android_virtual_device:
      create:
        command: >
          avdmanager create avd --name "PixelLikeApi34" --package "system-images;android-34;google_apis;x86_64" --device "pixel_5"
      run: 'emulator -avd PixelLikeApi34'
      verify: 'adb devices  # expect emulator-5554 listed'
      manual_testing_hints:
        - "Toggle dark theme and large font."
        - "Adjust date/time to simulate rota changes."
        - "Rotate orientation via emulator toolbar."
    project_location_strategy:
      preferred_path_windows: "C:\\dev\\roto-app"
      preferred_path_wsl: "/mnt/c/dev/roto-app"
      rationale:
        - "Single shared workspace for Gradle builds and Windows-side adb installs."
        - "No need to copy APKs between environments."
    dev_loop:
      - step: build_apk_in_wsl
        commands:
          - 'cd /mnt/c/dev/roto-app'
          - './gradlew assembleDebug'
        output: "/mnt/c/dev/roto-app/app/build/outputs/apk/debug/app-debug.apk"
      - step: run_emulator_on_windows
        command: 'emulator -avd PixelLikeApi34'
      - step: install_apk_from_windows
        commands:
          - 'adb devices'
          - 'adb install -r C:\\dev\\roto-app\\app\\build\\outputs\\apk\\debug\\app-debug.apk'
      - step: manual_validation
        checks:
          - "Tomorrow's rota populated with the correct slots/notes (including overrides)."
          - "Changing emulator date updates the displayed rota."
          - "Weekends or unmatched dates show a polite no-rota message."

  execution_plan:
    immediate_next_steps:
      - "Harden schema 0.3 validation and surface friendly error messages when required fields are missing."
      - "Remember last-opened week/tab state for faster browsing."
      - "Polish accessibility copy and consider larger text spacing for the setup instructions."
    upcoming_milestones:
      - "Offer optional pretty-print/report of the JSON structure for manual editors."
      - "Add automated tests around repository failure handling and week browsing edge cases."
      - "Explore homescreen widget or notification ideas once core flows are stable."

  definition_of_done:
    - "App installs and runs offline without proprietary services."
    - "First launch prompts for rota JSON; saved data persists across restarts."
    - "Tomorrow view and pick-a-day both display accurate slots or graceful no-rota messaging."
    - "Invalid dates, overrides, and weekends are handled without crashes."
    - "Project remains F-Droid friendly (no analytics, ads, or Play Services)."

  collaboration_notes:
    purpose_of_file: "Primary shared memory for mission, environment, and workflow; update after major decisions."
    working_agreements:
      - "Prefer small, testable increments and validate builds in WSL before Windows installs."
      - "Document new setup steps or architecture shifts here to keep both humans and AI aligned."
      - "Surface open questions or blockers in future updates so we can address them early."
    validation_habits:
      - "Run Gradle builds from WSL when code changes land."
      - "Exercise emulator scenarios listed above after significant UI or logic updates."
      - "Keep sample JSON assets in sync with the documented schema (0.3)."
  parent_prompt_strategy:
    goal: "Let parents convert their rota PDF/photo into schema 0.3 JSON without embedding OCR logic in-app."
    ai_helper_asset: "app/src/main/assets/ai_llm_instructions.txt"
    workflow_summary:
      - "The setup screen leads with plain-language instructions and a 'Copy AI Instructions' button (copies the asset text to the clipboard)."
      - "Parents paste the prompt into any AI assistant, supply their current rota PDF/photo/text, and request the JSON conversion."
      - "AI output should be saved as a `.json` file (the app suggests `RotoRota.json`, but any filename works)."
      - "Parents either load the file through the app or drop it into the app-scoped Downloads folder; the app remembers the selection and can be cleared to return to setup."
      - "Sample rotas live in app/src/main/assets/sample_rotas for demos or quick testing; keep them tidy and valid."

  references:
    source_documents:
      - ai_post_env_setup_primer.yaml
      - ai_mission_primer.yaml
