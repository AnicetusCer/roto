project_primer:
  project_identity:
    name: "Roto"
    mission_summary: >
      Offline, privacy-first Android app (F-Droid friendly) that tells anyone managing
      a rotating schedule what is happening on any given date using repeating week
      patterns (Week 1 / Week 2 / Week 3 …).
    core_question: "What's on the rota tomorrow?"
    status: "Interactive Compose app in place with JSON import, tomorrow/today view, week browser, and override-aware domain logic."
    maintainer: "AnicetusCer"
    website: "https://anicetuscer.github.io/roto/"
    privacy_policy_url: "https://anicetuscer.github.io/roto/PRIVACY.html"
    repo: "https://github.com/AnicetusCer/roto"
    audience:
      primary:
        - people managing personal or family rotas
        - organisers and coordinators of clubs, teams, or workplaces
        - rota followers who need tomorrow's plan at a glance
      stretch:
        - any rotating schedule that benefits from an offline summary
    principles:
      - offline_first: "All rota data and logic stay on device; no servers or logins."
      - privacy: "No analytics, tracking, or ads; F-Droid-friendly dependencies only."
      - human_editable_data: "Users can paste and edit a human-readable JSON rota."
      - predictable: "If there is no rota for a date, surface a clear 'No rota found' message."
      - reproducible_builds: "Pin Gradle wrapper with distributionSha256Sum, disable dependency metadata signing blocks, and name release APKs roto-v<version>.apk to align with F-Droid binaries."

  product_scope:
    core_features:
      - key: show_tomorrow_default
        description: "Launch straight into tomorrow's rota with ordered slots, notes, and any override reason."
      - key: choose_any_date
        description: "Allow quick selection of any date to view the corresponding rota entry."
      - key: rotation_awareness
        description: "Map real calendar dates to Week 1/2/3 style cycles via configured week_commencing Mondays, honour per-date overrides, and loop indefinitely when a repeat anchor is provided."
      - key: offline_persistence
        description: "Persist the rota JSON locally so data survives app restarts and works offline."
      - key: human_editable_data
        description: "Support pasting or importing JSON that any user can tweak or regenerate with an AI."
      - key: shared_link_rotas
        description: "Accept GitHub Gist (or other HTTPS) links, mirror the downloaded JSON into the Downloads/Roto folder, and treat it exactly like a local file with automatic refresh + offline fallback."
      - key: browse_week_rota
        description: "Allow users to open any published week pattern and inspect all configured days (weekday or weekend)."
      - key: recent_rotas
        description: "Keep a recents list of the last 5–10 rotas (local or shared links) for one-tap reopening, with a clear/reset option in Settings and share/copy buttons for remote entries."
      - key: loaded_rota_card
        description: "When a rota is loaded, show a card with rename/share/copy (for remote), refresh, and view actions without leaving the setup screen."
    stretch_goals:
      - key: home_screen_widget
        description: "Android widget showing tomorrow's rota summary."
      - key: multiple_profiles
        description: "Optional ability to store rotas for more than one school or club."
      - key: holiday_exceptions
        description: "Rota owners can mark closed days or special events without editing the base rotation."
      - key: allergen_filtering
        description: "Surface dietary tags supplied by the school as display-only info."
      - key: export_import_share
        description: "One-tap share of the stored JSON to help other teams or households."

  data_model:
    schema_version: "0.3"
    structure_highlights:
      - "rota_name string (display header) and optional notes[] for global messages. (Legacy files may use school_name; still accepted.)"
      - "cycle.weeks[] with week_id, week_commencing[] (ISO Mondays), and days{} mapping weekday names or ISO dates to DayDefinition."
      - "DayDefinition provides slots[] (ordered {label, text, tags[]}) plus optional notes[]. A day/override can also set a single special_event string shown as a banner before the slots. For quick one-off banners without editing a day, use top-level special_events{\"YYYY-MM-DD\": \"message\"}."
      - "Top-level special_events values can be a single string or an array of strings to show multiple banners on the same date; they sit behind any override/day special_event."
      - "Optional cycle.repeat{start_date, start_week_id} enables the rota to loop indefinitely without enumerating future Mondays."
      - "overrides{} maps ISO dates to OverrideDay with closed/reason/slots/notes for one-off changes."
      - "\"source\" metadata records whether the active rota came from a local document or remote gist (uri, last_synced_epoch, cache_uri)."
    design_rationale: "Supports any repeating rota (meals, clubs, duties) while staying human-editable for users and organisers."

  rotation_logic:
    steps:
      - "Check overrides{} for the target date; if found and closed=true, surface a polite closed message."
      - "If no override (or override supplies slots), find monday_of_week for the target date."
      - "Match monday_of_week against any cycle.weeks[].week_commencing entry."
      - "If nothing explicit matches and cycle.repeat is set, compute the week by looping from repeat.start_date onward."
      - "Resolve the day's slots by weekday key (monday…sunday) or ISO-specific key."
      - "If nothing matches, show a friendly 'No rota found for this date' message."
    timezone_policy: "Treat 'today' and 'tomorrow' strictly as the device's current local date; users can rely on their device clock for any travel or DST adjustments."
    special_event_policy: "Priority: override.special_event → day.special_event → special_events[date]. Display it even when the day is closed so reminders remain visible, and allow a banner even if no slots are present."

  tech_foundation:
    platform: "Android (minSdk 24, Kotlin, Jetpack Compose)."
    storage: >
      Keep JSON in user-managed files; remember the chosen URI via Preferences DataStore so the app can reload it.
      Mirrored remote rotas are saved alongside other files in Downloads/Roto (scoped storage aware) so the system, widgets, and the user all point at the same document.
    dependency_constraints:
      - "Avoid Google Play Services and proprietary analytics for F-Droid friendliness and Play Store privacy compliance."
      - "Keep the build reproducible with FLOSS-friendly tooling."
    network_and_caching:
      client: "OkHttp-based fetcher that can resolve gist page links to their raw JSON without Play Services."
      sync_policy: "On setup or manual/auto refresh, download the gist JSON, validate schema 0.3, then overwrite the mirrored file and update last_synced metadata."
      offline_behavior: "If a gist fetch fails (404/offline), surface a persistent warning, mark the remote status as cached, and keep using the last downloaded copy until the link recovers. Widget Today/Tomorrow toggles use the local copy for responsiveness; the Refresh action triggers the network fetch."

  architecture_and_ui:
    layers:
      - name: data_layer
        responsibilities:
          - load_rota_json_from_selected_source
          - remember_selected_rota_reference
          - parse_json_to_models (schema 0.3)
          - fetch_rota_from_gist_url_and_validate
          - cache_remote_payload_for_offline_use
      - name: domain_layer
        responsibilities:
          - get_rota_for_date (override + rotation lookup)
          - format_slots_and_notes_for_presentation
      - name: ui_layer
        responsibilities:
          - Compose screens for home, pick-a-day, and setup
          - Manage minimal state via ViewModels
      - name: widget_layer (stretch)
        responsibilities:
          - Provide a glanceable tomorrow summary using the same domain logic
    screens:
      - home_screen:
          purpose: "Default landing page for tomorrow's rota."
          key_elements:
            - heading
            - formatted_date
            - slot_list (ordered slots with tags)
            - reason_or_notes (override/day/global notes)
            - button_view_other_day
            - button_refresh_remote (visible only when a shared link is configured; triggers background sync, updates warning banner if the link is unreachable)
      - pick_a_day_screen:
          purpose: "Browse any date's rota via date picker or next/prev controls."
      - setup_screen:
          purpose: "Initial and repeat JSON import/edit experience with validation."
          modes:
            - "Pick a local JSON file (existing flow)."
            - "Paste or edit a GitHub Gist URL (expects the raw JSON endpoint)."
          helpers:
            - "Show last synced timestamp and cached-warning state when a remote link is active."
            - "Surface a permanent banner if the remote link fails while keeping the mirrored file active."
            - "Expose recents list with share/copy for remote entries; loaded card exposes rename/share/copy/refresh and can open the rota directly."
    orientation:
      lock_to_portrait: "Keep the app in a non-rotating, vertical layout so the UI stays consistent for parents."

  development_environment:
    topology:
      dev_os: "WSL Fedora 42 inside Windows 11."
      editor: "VS Code connected to the WSL workspace."
      build_side: "WSL builds the APK via Gradle using Linux SDK and JDK."
      test_side: "Windows 11 runs the Android Emulator for interactive testing."
      privacy_target: "No Play Services dependency; deliver an offline app that is F-Droid friendly and Play Store compliant with a public privacy policy at https://anicetuscer.github.io/roto/PRIVACY.html."
    wsl_fedora_setup:
      sdk_root: "/home/Mile/Android/sdk"
      java:
        version: "OpenJDK 21 (java-21-openjdk-devel or equivalent)."
        verification:
          - "java -version"
          - "javac -version"
        bashrc_exports:
          - 'export JAVA_HOME="/usr/lib/jvm/<java-21-path>"'
          - 'export PATH="$JAVA_HOME/bin:$PATH"'
      android_sdk:
        layout: "/home/Mile/Android/sdk with cmdline-tools, platform-tools, build-tools."
        bashrc_exports:
          - 'export ANDROID_SDK_ROOT="/home/Mile/Android/sdk"'
          - 'export ANDROID_HOME="$ANDROID_SDK_ROOT"'
          - 'export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"'
          - 'export PATH="$PATH:$ANDROID_SDK_ROOT/platform-tools"'
          - 'export PATH="$PATH:$ANDROID_SDK_ROOT/emulator"'
        essential_packages:
          - 'sdkmanager --licenses'
          - 'sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"'
    windows_11_setup:
      virtualization_check: "Task Manager → Performance → CPU → Virtualization: Enabled."
      android_sdk_root: "C:\\Android\\sdk"
      env_paths:
        - "C:\\Program Files\\Microsoft\\jdk-21.0.8.9-hotspot\\bin"
        - "C:\\Android\\sdk\\cmdline-tools\\latest\\bin"
        - "C:\\Android\\sdk\\platform-tools"
        - "C:\\Android\\sdk\\emulator"
      verification:
        - 'echo $env:JAVA_HOME'
        - 'java -version'
        - 'where.exe java'
        - 'sdkmanager --version'
      packages_to_install:
        - 'sdkmanager --licenses'
        - 'sdkmanager "platform-tools" "emulator" "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64"'
    android_virtual_device:
      create:
        command: >
          avdmanager create avd --name "PixelLikeApi34" --package "system-images;android-34;google_apis;x86_64" --device "pixel_5"
      run: 'emulator -avd PixelLikeApi34'
      verify: 'adb devices  # expect emulator-5554 listed'
      manual_testing_hints:
        - "Toggle dark theme and large font."
        - "Adjust date/time to simulate rota changes."
        - "Orientation is portrait-only; rotate the emulator to confirm the UI remains locked vertically."
    project_location_strategy:
      preferred_path_windows: "C:\\dev\\roto-app"
      preferred_path_wsl: "/mnt/c/dev/roto-app"
      rationale:
        - "Single shared workspace for Gradle builds and Windows-side adb installs."
        - "No need to copy APKs between environments."
    dev_loop:
      - step: build_apk_in_wsl
        commands:
          - 'cd /mnt/c/dev/roto-app'
          - './gradlew assembleDebug'
        output: "/mnt/c/dev/roto-app/app/build/outputs/apk/debug/app-debug.apk"
      - step: run_emulator_on_windows
        command: 'emulator -avd PixelLikeApi34'
      - step: install_apk_from_windows
        commands:
          - 'adb devices'
          - 'adb install -r C:\\dev\\roto-app\\app\\build\\outputs\\apk\\debug\\app-debug.apk'
      - step: manual_validation
        checks:
          - "Tomorrow's rota populated with the correct slots/notes (including overrides)."
          - "Changing emulator date updates the displayed rota."
          - "Weekends or unmatched dates show a polite no-rota message."
          - "Gist-backed rotas load, refresh on demand, and remain readable when the device switches offline."

  execution_plan:
    immediate_next_steps:
      - "Harden schema 0.3 validation and surface friendly error messages when required fields are missing."
      - "Remember last-opened week/tab state for faster browsing."
      - "Polish accessibility copy and consider larger text spacing for the setup instructions."
      - "Prototype GitHub Gist onboarding (URL entry, validation, storage metadata, manual refresh controls)."
      - "Add HTTP client + background sync job that caches gist payloads for offline continuity."
    upcoming_milestones:
      - "Offer optional pretty-print/report of the JSON structure for manual editors."
      - "Add automated tests around repository failure handling and week browsing edge cases."
      - "Explore homescreen widget or notification ideas once core flows are stable."

  definition_of_done:
    - "App installs and runs offline without proprietary services."
    - "First launch prompts for rota JSON; saved data persists across restarts."
    - "Tomorrow view and pick-a-day both display accurate slots or graceful no-rota messaging."
    - "Invalid dates, overrides, and weekends are handled without crashes."
    - "Project remains F-Droid friendly (no analytics, ads, or Play Services)."
    - "GitHub Gist-sourced rotas sync successfully at least once, warn about staleness, and keep serving the cached copy offline."
    - "Public GitHub Pages site at https://anicetuscer.github.io/roto/ links privacy policy, legal summary, and source code for store listings."

  collaboration_notes:
    purpose_of_file: "Primary shared memory for mission, environment, and workflow; update after major decisions."
    working_agreements:
      - "Prefer small, testable increments and validate builds in WSL before Windows installs."
      - "Document new setup steps or architecture shifts here to keep both humans and AI aligned."
      - "Surface open questions or blockers in future updates so we can address them early."
    validation_habits:
      - "Run Gradle builds from WSL when code changes land."
      - "Exercise emulator scenarios listed above after significant UI or logic updates."
      - "Keep sample JSON assets in sync with the documented schema (0.3)."
  parent_prompt_strategy:
    goal: "Let parents convert their rota PDF/photo into schema 0.3 JSON without embedding OCR logic in-app."
    ai_helper_asset: "app/src/main/assets/ai_llm_instructions.txt"
    workflow_summary:
      - "The setup screen leads with plain-language instructions and a 'Copy AI Instructions' button (copies the asset text to the clipboard)."
      - "Parents paste the prompt into any AI assistant, supply their current rota PDF/photo/text, and request the JSON conversion."
      - "AI output should be saved as a `.json` file (the app suggests `RotoRota.json`, but any filename works)."
      - "Parents either load the file through the app or drop it into the app-scoped Downloads folder; the app remembers the selection and can be cleared to return to setup."
      - "For easy sharing, parents (or schools) can publish that JSON in a GitHub Gist and send the raw link to caretakers; the app treats it as a read-only, cacheable source."
      - "Sample rotas live in app/src/main/assets/sample_rotas for demos or quick testing; keep them tidy and valid."

  shared_link_strategy:
    rationale: "Many families receive a rota from a coordinator; a shared link removes the need to manually pass JSON files around."
    supported_sources:
      - "GitHub Gist raw URLs (https://gist.githubusercontent.com/<user>/<gist-id>/raw/<revision>/rota.json)."
      - "Other HTTPS endpoints that return schema 0.3 JSON without auth; structure the abstraction so more sources can be plugged in later."
    ux_considerations:
      - "Setup screen offers two tabs: Local File and Shared Link; both store their latest success in Preferences DataStore."
      - "Show validation feedback if the pasted link is not HTTPS or does not point at JSON."
      - "Expose last synced timestamp + 'Refresh now' affordance on home/pick-a-day screens for remote sources."
    caching_rules:
      - "Every successful download writes the payload to app-specific storage along with url + etag/hash metadata."
      - "Offline state keeps delivering the cached payload and surfaces a subtle 'Using cached link from <date/time>' message."
      - "If a download fails or the payload is invalid, block the switch to remote mode until the user retries or reverts to local."
    sample_data: "Add a developer gist (link tracked in docs or .env) so QA can test shared-link mode without external dependencies."

  references:
    source_documents:
      - ai_post_env_setup_primer.yaml
      - ai_mission_primer.yaml
      - docs/PRIVACY.md
      - docs/LEGAL.md
      - docs/index.md
      - docs/fdroid-metadata-template.yml
