Summary: Offline rotating rota viewer
Description: |
  Roto is a privacy-first Android app that answers one simple question:
  “What’s on the rota tomorrow?”.

  - Shows today’s and tomorrow’s rota at a glance
  - Supports arbitrary rotating week patterns (Week 1 / Week 2 / Week 3…)
  - Handles per-date overrides (closures, special events) without changing the base cycle
  - Stores everything on-device in a human-editable JSON file
  - Can mirror JSON from a user-provided HTTPS link for convenient sharing
  - Includes a homescreen widget for quick access

  No analytics, no tracking, and no proprietary dependencies. All rota data
  stays on the device.

